<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Zyzoom Media Sniffer</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/sniffer.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="11" cy="11" r="6" /><path d="M15.5 15.5L20 20" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 18z" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </symbol>
        <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M5 12h14" />
        </symbol>
        <symbol id="i-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="5.5" y="5.5" width="13" height="13" rx="1.5" />
        </symbol>
        <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </symbol>
        <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" />
        </symbol>
        <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="M10 9.5l5 2.5-5 2.5z" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5 5L20 6.5" />
        </symbol>
        <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <path d="M12 3l9 5-9 5-9-5z" /><path d="M3 13l9 5 9-5" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12" /><path d="M7 11l5 5 5-5" /><path d="M5 21h14" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16" /><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7" />
          <path d="M6.5 7l.8 12a2 2 0 0 0 2 1.9h5.4a2 2 0 0 0 2-1.9L17.5 7" />
        </symbol>
      </defs>
    </svg>

    <div class="app-shell sniffer">
      <aside class="sidebar">
        <div class="brand">
          <img src="assets/logo.png" alt="Zyzoom" />
          <div class="brand-caption">ZYZOOM DOWNLOAD MANAGER</div>
        </div>
        <nav class="nav">
          <button class="nav-item active"><span class="icon"><svg><use href="#i-layers" /></svg></span><span>الوسائط المكتشفة</span></button>
          <button class="nav-item"><span class="icon"><svg><use href="#i-music" /></svg></span><span>الصوتيات</span></button>
          <button class="nav-item"><span class="icon"><svg><use href="#i-video" /></svg></span><span>الفيديوهات</span></button>
        </nav>
        <div class="sidebar-footer">
          <button class="nav-item" data-action="clear"><span class="icon"><svg><use href="#i-trash" /></svg></span><span>مسح القائمة</span></button>
        </div>
      </aside>

      <main class="workspace">
        <header class="titlebar">
          <button class="icon-btn" title="القائمة" data-action="toggle-nav"><svg><use href="#i-menu" /></svg></button>
          <div>
            <span class="title">كاشف الوسائط ومُنزّل الفيديو</span>
            <span class="subtitle">(Media Sniffer &amp; Video Downloader)</span>
          </div>
          <div class="spacer"></div>
          <div class="window-controls">
            <button class="wbtn" title="تصغير" data-window="minimize"><svg><use href="#i-minus" /></svg></button>
            <button class="wbtn" title="تكبير" data-window="maximize"><svg><use href="#i-square" /></svg></button>
            <button class="wbtn close" title="إغلاق" data-window="close"><svg><use href="#i-x" /></svg></button>
          </div>
        </header>

        <div class="sniffer-url">
          <span class="url-icon"><svg><use href="#i-search" /></svg></span>
          <input class="url-input" id="sniff-url" type="text" dir="ltr"
            placeholder="https://www.example.com/watch/12345.html" />
          <button class="url-btn" title="فتح مجلد" data-action="open-folder"><svg><use href="#i-folder" /></svg></button>
          <button class="url-btn accent" title="فحص" data-action="scan"><svg><use href="#i-plus" /></svg></button>
        </div>

        <div class="sniffer-body">
          <section class="sniffer-main">
            <div class="panel-head">
              <h3>ملفات الوسائط المكتشفة</h3>
              <span class="legend"><span><i style="background: #22d3ee"></i> <b id="detected-count">0</b> عنصر</span></span>
            </div>
            <div id="media-list" class="media-list"></div>
          </section>

          <aside class="quick-sniffer">
            <div class="panel-head"><h3>الكاشف السريع</h3></div>
            <div class="qs-block">
              <div class="qs-title">كشف تلقائي</div>
              <div class="qs-item"><span class="qs-label"><svg><use href="#i-music" /></svg> صوتي</span><span class="qs-check"><svg><use href="#i-check" /></svg></span></div>
              <div class="qs-item"><span class="qs-label"><svg><use href="#i-music" /></svg> صوتي</span><span class="qs-check"><svg><use href="#i-check" /></svg></span></div>
            </div>
            <div class="qs-block">
              <div class="qs-title">التقاط الفيديو</div>
              <div class="qs-item"><span class="qs-label"><svg><use href="#i-video" /></svg> التقاط الفيديو</span><span class="qs-check"><svg><use href="#i-check" /></svg></span></div>
              <div class="qs-item"><span class="qs-label"><svg><use href="#i-video" /></svg> التقاط الفيديو</span><span class="qs-check"><svg><use href="#i-check" /></svg></span></div>
            </div>
            <div class="qs-block">
              <div class="qs-title">خيارات</div>
              <label class="switch" style="margin-bottom: 8px"><input type="checkbox" id="qs-auto" checked /><span>فحص تلقائي</span></label>
              <label class="switch" style="margin-bottom: 8px"><input type="checkbox" id="qs-sub" checked /><span>تحميل الترجمات</span></label>
              <label class="switch"><input type="checkbox" id="qs-size" /><span>تحديد الحجم الأقصى</span></label>
            </div>
          </aside>
        </div>

        <footer class="statusbar">
          <span class="sb-item">العناصر المكتشفة: <b id="sb-detected">0</b></span>
          <span class="sb-item">المحدد: <b id="sb-checked">0</b></span>
          <span class="spacer"></span>
          <span class="sb-item">Zyzoom Media Sniffer <b>1.0.0</b></span>
        </footer>
      </main>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/sniffer.js"></script>
  </body>
</html>
