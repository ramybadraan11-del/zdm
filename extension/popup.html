<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        background: #0c1728;
        color: #e8f0fb;
        font-family: 'Cairo', 'Tajawal', 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      p {
        margin: 0 0 12px;
        color: #8fa3bd;
        font-size: 12px;
      }
      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #101f35;
        border: 1px solid #1d3050;
        margin-bottom: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #f4676b;
      }
      .dot.ok {
        background: #2fe0a4;
      }
      button {
        width: 100%;
        padding: 9px;
        border-radius: 9px;
        border: 1px solid #1d3050;
        background: #14243d;
        color: #e8f0fb;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #17294a;
      }
      .count {
        color: #22d3ee;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Zyzoom Capture</h1>
    <p>التقاط روابط الوسائط وإرسالها إلى Zyzoom Download Manager</p>
    <div class="state"><span class="dot" id="dot"></span><span id="status">جارٍ الفحص…</span></div>
    <p>العناصر المرسلة: <span class="count" id="count">0</span></p>
    <button id="ping">فحص الاتصال بالتطبيق</button>
    <script src="popup.js"></script>
  </body>
</html>
