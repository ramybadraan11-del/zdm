<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zyzoom Download Manager (ZDM) — multi-segment download accelerator with browser capture and video download. Developed by Ramy Badraan."
    />
    <meta name="author" content="Ramy Badraan" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />

    <!-- Fonts are bundled: the app must render correctly offline. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <title>Zyzoom Download Manager</title>

    <style>
      /* Inline critical paint so the window never flashes white on open. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070c18;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 100% at 50% 0%, #101d36 0%, #070c18 60%);
        transition: opacity 0.22s ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      .boot-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #22d3ee, #8b5cf6);
        color: #04101f;
        font: 900 20px/1 'Cairo', system-ui, sans-serif;
        box-shadow: 0 12px 32px rgba(34, 211, 238, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="boot-mark">Z</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
