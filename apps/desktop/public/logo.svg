<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Zyzoom Download Manager">
  <title>Zyzoom Download Manager</title>

  <defs>
    <!-- Squircle body: deep navy, lit from the top-left -->
    <linearGradient id="body" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1E2E52"/>
      <stop offset="0.5" stop-color="#111C36"/>
      <stop offset="1" stop-color="#080F1F"/>
    </linearGradient>

    <!-- Rim light that separates the mark from any background -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE2FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Single brand accent: aqua to cyan to violet -->
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7CF2DC"/>
      <stop offset="0.42" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.38" r="0.52">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft depth under the glyph -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020817" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Body + ambient light -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#body)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#halo)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="114.5"
        fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!--
    The mark is a single confident idea: a bold monolithic "Z" sitting on a
    download shelf. Only two shapes, thick strokes, no fine detail — so it stays
    readable at 16 px (taskbar) and looks intentional at 512 px.
  -->
  <g filter="url(#drop)">
    <!-- Z as one filled letterform, centred in a 256x256 box -->
    <path fill="url(#mark)"
          d="M128 128 H384 V178 L236 268 H384 V320 H128 V270 L276 180 H128 Z"/>
  </g>

  <!-- Download shelf: reads as the tray a download lands in -->
  <rect x="176" y="366" width="160" height="22" rx="11" fill="url(#shelf)"/>
</svg>
