[package]
name = "zdm"
version = "1.3.0"
description = "Zyzoom Download Manager (ZDM) - High-Performance Multi-Segment Download Accelerator. Developed by Ramy Badraan."
authors = ["Ramy Badraan"]
edition = "2021"
license = "Proprietary"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `custom-protocol` is what tells Tauri to serve the embedded frontend instead of
# dev-server URLs (http://localhost:1420). The Tauri CLI enables it for
# `tauri build`, but a plain `cargo build --release` does NOT — which produced
# binaries that opened a blank window and printed
# "Could not connect to localhost: Connection refused".
# Making it default means every build path produces a self-contained app.
default = ["custom-protocol"]
# BOTH crates need the flag: `tauri` embeds the assets, and `tauri-macros`
# generates `dev = cfg!(not(feature = "custom-protocol"))` for
# `generate_context!`. Enabling it only on `tauri` leaves the macro in dev mode,
# so the window tries http://localhost:1420 and shows "Connection refused".
custom-protocol = ["tauri/custom-protocol", "tauri-macros/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Declared explicitly so its `custom-protocol` feature can be enabled: that flag
# is what makes `generate_context!` embed the frontend instead of pointing at the
# dev server. See the [features] section above.
tauri-macros = { version = "2" }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
url = "2.5"
urlencoding = "2.1"
anyhow = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
log = "0.4"
# Extracting ffmpeg.exe from the official release archive (video muxing needs it).
zip = { version = "2", default-features = false, features = ["deflate"] }
env_logger = "0.11"
librqbit = { version = "9.0.1", default-features = false, features = ["default-tls"] }

[dev-dependencies]
# Blocking HTTP client used only by the local test servers.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
