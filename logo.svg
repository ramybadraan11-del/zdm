<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#FF2E93"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121832"/>
      <stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#g)" stroke-opacity="0.35" stroke-width="3"/>
  <!-- speed lines -->
  <g stroke="url(#g)" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <line x1="70" y1="215" x2="115" y2="215"/>
    <line x1="58" y1="256" x2="118" y2="256"/>
    <line x1="70" y1="297" x2="115" y2="297"/>
  </g>
  <!-- Z = top bar + bolt diagonal + bottom bar that ends with a download arrow -->
  <g filter="url(#glow)" fill="none" stroke="url(#g)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 150 H376 L166 346 H330"/>
  </g>
  <!-- download arrow head -->
  <g filter="url(#glow)" fill="none" stroke="#FF2E93" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M366 316 L396 346 L366 376"/>
  </g>
  <!-- tray line -->
  <rect x="140" y="400" width="232" height="10" rx="5" fill="url(#g)" opacity="0.8"/>
</svg>
