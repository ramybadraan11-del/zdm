<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260">
  <defs>
    <radialGradient id="wmBg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#141C33"/>
      <stop offset="60%" stop-color="#0B0F1D"/>
      <stop offset="100%" stop-color="#060811"/>
    </radialGradient>

    <linearGradient id="wmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF2E93"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F5FF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#7C4DFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="wmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background panel -->
  <rect width="920" height="260" rx="24" fill="url(#wmBg)" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="60" y1="210" x2="860" y2="210" stroke="url(#glowLine)" stroke-width="1.5"/>

  <!-- Logo Mark on the Left (x=50, y=30, size=150) -->
  <g transform="translate(50, 30) scale(0.293)">
    <!-- Base Squircle -->
    <rect x="24" y="24" width="464" height="464" rx="112" fill="#0D1322" stroke="url(#wmGrad)" stroke-width="6"/>
    <!-- Z Segments -->
    <path d="M 104 148 L 244 148 L 194 198 L 104 198 Z" fill="#00F5FF"/>
    <path d="M 264 148 L 388 148 C 402 148 412 158 410 172 L 398 198 L 278 198 Z" fill="#38BDF8"/>
    <path d="M 404 176 L 202 366 L 302 366 L 416 230 C 426 216 420 186 404 176 Z" fill="url(#wmGrad)" filter="url(#wmGlow)"/>
    <path d="M 112 316 L 228 316 L 176 366 L 112 366 Z" fill="#818CF8"/>
    <path d="M 124 366 L 408 366 L 366 414 L 124 414 C 110 414 100 402 104 388 Z" fill="#F472B6"/>
    <!-- Arrows -->
    <polygon points="256,190 286,242 226,242" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="256,234 300,310 212,310" fill="#00F5FF" opacity="0.8"/>
    <polygon points="256,298 316,396 196,396" fill="#00F5FF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(230, 45)">
    <!-- ZDM Acronym Badge -->
    <text x="0" y="58" font-family="'JetBrains Mono', 'Inter', monospace, sans-serif" font-weight="900" font-size="58" fill="url(#wmGrad)" letter-spacing="4" filter="url(#wmGlow)">ZDM</text>
    <rect x="180" y="16" width="168" height="26" rx="6" fill="#00F5FF" fill-opacity="0.12" stroke="#00F5FF" stroke-opacity="0.3"/>
    <text x="188" y="34" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#00F5FF" letter-spacing="2">32-STREAM TURBO</text>

    <!-- Full Title -->
    <text x="0" y="104" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="url(#textGrad)" letter-spacing="1">Zyzoom Download Manager</text>

    <!-- Subtitle -->
    <text x="0" y="132" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="15" fill="#818CF8" letter-spacing="0.5">High-Performance Multi-Segment Download Accelerator for Linux &amp; Windows</text>
  </g>

  <!-- Developer Attribution Bar -->
  <g transform="translate(60, 236)">
    <circle cx="10" cy="-6" r="4" fill="#00F5FF" filter="url(#wmGlow)"/>
    <text x="24" y="-2" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#E2E8F0">
      Developed by <tspan fill="#00F5FF" font-weight="800">Ramy Badraan</tspan>
    </text>
    <text x="440" y="-2" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">
      Tauri 2 • Rust Core • Multi-Range • Zero-Lag Write
    </text>
    <text x="760" y="-2" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#10B981">
      v1.0.0 Pro
    </text>
  </g>
</svg>
