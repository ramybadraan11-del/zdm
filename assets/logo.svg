<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#182038"/>
      <stop offset="50%" stop-color="#0E1324"/>
      <stop offset="100%" stop-color="#070A14"/>
    </radialGradient>

    <!-- Main Z Stream Gradient -->
    <linearGradient id="zStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Parallel Connection Rays Gradients -->
    <linearGradient id="ray1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="ray2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ray3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="ray4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Core Download Arrow Beam -->
    <linearGradient id="arrowGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle Container with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Cyber Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="3" stroke-opacity="0.85"/>
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>

  <!-- High-Tech Background Orbit Grid / Accents -->
  <g opacity="0.25">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="8 12"/>
    <circle cx="256" cy="256" r="140" fill="none" stroke="#00F5FF" stroke-width="1" stroke-dasharray="4 8"/>
    <!-- Tech ticks -->
    <line x1="256" y1="44" x2="256" y2="58" stroke="#00F5FF" stroke-width="2"/>
    <line x1="256" y1="454" x2="256" y2="468" stroke="#EC4899" stroke-width="2"/>
    <line x1="44" y1="256" x2="58" y2="256" stroke="#3B82F6" stroke-width="2"/>
    <line x1="454" y1="256" x2="468" y2="256" stroke="#8B5CF6" stroke-width="2"/>
  </g>

  <!-- Multi-Segment Parallel Speed Streams (The Secret Engine of ZDM) -->
  <g filter="url(#neonGlow)">
    <!-- Segment Stream 1 (Top Left Acceleration) -->
    <path d="M 104 148 L 244 148 L 194 198 L 104 198 Z" fill="url(#ray1)" opacity="0.95"/>
    
    <!-- Segment Stream 2 (Core Diagonal Power Drive) -->
    <path d="M 264 148 L 388 148 C 402 148 412 158 410 172 L 398 198 L 278 198 Z" fill="url(#ray2)" opacity="0.95"/>
    
    <!-- Heavy Z Center Lightning Blade -->
    <path d="M 404 176 L 202 366 L 302 366 L 416 230 C 426 216 420 186 404 176 Z" fill="url(#zStream)" filter="url(#hyperGlow)"/>

    <!-- Segment Stream 3 (Dynamic Lower Parallel Track) -->
    <path d="M 112 316 L 228 316 L 176 366 L 112 366 Z" fill="url(#ray3)" opacity="0.9"/>
    
    <!-- Segment Stream 4 (Bottom Base Thrust) -->
    <path d="M 124 366 L 408 366 L 366 414 L 124 414 C 110 414 100 402 104 388 Z" fill="url(#ray4)" opacity="0.95"/>
  </g>

  <!-- Supersonic Download Arrowhead (Integrated in the Z Core) -->
  <g filter="url(#neonGlow)">
    <polygon points="256,190 286,242 226,242" fill="url(#arrowGleam)" opacity="0.85"/>
    <polygon points="256,234 300,310 212,310" fill="url(#arrowGleam)" opacity="0.7"/>
    <polygon points="256,298 316,396 196,396" fill="#00F5FF" opacity="0.9"/>
    <!-- Precision Center Point -->
    <circle cx="256" cy="404" r="5" fill="#FFFFFF" filter="url(#hyperGlow)"/>
  </g>

  <!-- Multi-Connection Status Dots (8 Parallel Channels) -->
  <g opacity="0.9">
    <circle cx="150" cy="434" r="3.5" fill="#00F5FF"/>
    <circle cx="180" cy="434" r="3.5" fill="#38BDF8"/>
    <circle cx="210" cy="434" r="3.5" fill="#60A5FA"/>
    <circle cx="240" cy="434" r="3.5" fill="#818CF8"/>
    <circle cx="270" cy="434" r="3.5" fill="#A78BFA"/>
    <circle cx="300" cy="434" r="3.5" fill="#C084FC"/>
    <circle cx="330" cy="434" r="3.5" fill="#E879F9"/>
    <circle cx="360" cy="434" r="3.5" fill="#F472B6"/>
  </g>

  <!-- Dynamic Corner Speed Flairs -->
  <circle cx="104" cy="148" r="4" fill="#00F5FF" filter="url(#hyperGlow)"/>
  <circle cx="408" cy="148" r="4" fill="#8B5CF6" filter="url(#hyperGlow)"/>
  <circle cx="366" cy="414" r="4" fill="#EC4899" filter="url(#hyperGlow)"/>
</svg>
